name: Pool Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Pool image version, e.g. 0.2.7-pool.2 (without v)'
        required: true
        type: string
      ref:
        description: 'Full 40-character commit SHA to build'
        required: true
        type: string

permissions:
  contents: write
  actions: read
  packages: write

concurrency:
  group: pool-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate release inputs
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ inputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-pool\.[0-9]+$ ]] || {
            echo '::error::version must match MAJOR.MINOR.PATCH-pool.NUMBER'
            exit 1
          }
          [[ "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::ref must be a full lowercase commit SHA'
            exit 1
          }
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "version=$RELEASE_VERSION"
            echo "commit=$RELEASE_REF"
            echo "image=$image"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.commit }}
          persist-credentials: false

      - name: Verify checkout
        env:
          RELEASE_REF: ${{ steps.release.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_REF"

      - name: Protect published application releases
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_REF: ${{ steps.release.outputs.commit }}
        with:
          script: |
            const tag = `pool-v${process.env.RELEASE_VERSION.replace('-pool.', '.')}`;
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              if (!release.draft) {
                throw new Error(`Published release ${tag} is immutable. Choose a new pool version.`);
              }
              if (release.target_commitish !== process.env.RELEASE_REF) {
                throw new Error(`Draft ${tag} belongs to a different commit.`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            // A manually created tag must also resolve to this exact release commit.
            try {
              let { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              let object = ref.object;
              for (let depth = 0; object.type === 'tag' && depth < 5; depth++) {
                const { data } = await github.rest.git.getTag({ ...context.repo, tag_sha: object.sha });
                object = data.object;
              }
              if (object.type !== 'commit' || object.sha !== process.env.RELEASE_REF) {
                throw new Error(`Tag ${tag} does not point to the requested release commit.`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Test persistent application runtime
        run: |
          /bin/sh deploy/tests/pool-app-runtime-test.sh
          node --test deploy/tests/pool-app-release-test.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Load and test the image before updating any registry tag.
      - name: Build pool image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          pull: true
          provenance: false
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:latest
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            COMMIT=${{ steps.release.outputs.commit }}
            DATE=${{ steps.release.outputs.created }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.commit }}
            org.opencontainers.image.created=${{ steps.release.outputs.created }}
          cache-from: type=gha,scope=pool-main-amd64
          cache-to: type=gha,mode=max,scope=pool-main-amd64

      - name: Verify host updater packaging and real Docker recovery
        env:
          POOL_IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash -n deploy/install-pool-updater.sh
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/tests/pool-updater-config-test.py
          extract=$(docker create --network none "$POOL_IMAGE:$RELEASE_VERSION")
          trap 'docker rm "$extract" >/dev/null 2>&1 || true' EXIT
          docker cp "$extract:/app/pool-updater" "$RUNNER_TEMP/pool-updater"
          docker cp "$extract:/app/pool-updater-install" "$RUNNER_TEMP/pool-updater-install"
          test -s "$RUNNER_TEMP/pool-updater-install/install-pool-updater.sh"
          test -s "$RUNNER_TEMP/pool-updater-install/pool-updater-config.py"
          test -s "$RUNNER_TEMP/pool-updater-install/pool-updater-compose.py"
          test -s "$RUNNER_TEMP/pool-updater-install/pool-updater.service"
          sudo /bin/bash deploy/tests/pool-updater-smoke.sh "$RUNNER_TEMP/pool-updater" "$POOL_IMAGE:$RELEASE_VERSION"

      - name: Verify image metadata and pool runtime
        env:
          POOL_IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_REF: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          metadata=$(docker image inspect "$POOL_IMAGE:$RELEASE_VERSION")
          jq -e --arg sha "$RELEASE_REF" --arg version "$RELEASE_VERSION" \
            '.[0] | .Os == "linux" and .Architecture == "amd64" and
            .Config.Labels["org.opencontainers.image.revision"] == $sha and
            .Config.Labels["org.opencontainers.image.version"] == $version' <<< "$metadata"
          version_output=$(docker run --rm --network none "$POOL_IMAGE:$RELEASE_VERSION" --version 2>&1)
          printf '%s\n' "$version_output"
          grep -F "Sub2API $RELEASE_VERSION (commit: $RELEASE_REF," <<< "$version_output"
          docker run --rm --network none "$POOL_IMAGE:$RELEASE_VERSION" sh -c \
            'test -z "${POOL_APP_UPDATE_SUPERVISED:-}" && test ! -d "$POOL_APP_UPDATE_DIR"'
          /bin/bash deploy/tests/pool-app-docker-test.sh "$POOL_IMAGE:$RELEASE_VERSION"

      - name: Require successful CI for the release commit
        uses: actions/github-script@v8
        timeout-minutes: 16
        env:
          RELEASE_REF: ${{ steps.release.outputs.commit }}
        with:
          script: |
            const sha = process.env.RELEASE_REF;
            const deadline = Date.now() + 15 * 60 * 1000;
            let previousState = '';
            let runURL = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/backend-ci.yml`;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: 'backend-ci.yml',
                head_sha: sha,
                event: 'push',
                per_page: 10,
              });
              const run = data.workflow_runs
                .filter(item => item.head_sha === sha && item.event === 'push')
                .sort((a, b) => b.id - a.id)[0];
              if (run) {
                runURL = run.html_url;
                const state = `${run.id}:${run.run_attempt}:${run.status}:${run.conclusion}`;
                if (state !== previousState) {
                  core.info(`CI for ${sha}: ${run.status} (${run.conclusion || 'pending'}) — ${runURL}`);
                  previousState = state;
                }
                if (run.status === 'completed') {
                  if (run.conclusion !== 'success') {
                    core.setFailed(`Publishing blocked: CI concluded ${run.conclusion} for ${sha}. ${runURL}`);
                    return;
                  }
                  core.info(`Release CI passed: ${runURL}`);
                  return;
                }
              } else if (previousState !== 'missing') {
                core.info(`Waiting for the backend-ci.yml push run for ${sha}. ${runURL}`);
                previousState = 'missing';
              }
              await new Promise(resolve => setTimeout(resolve, Math.min(30_000, Math.max(0, deadline - Date.now()))));
            }
            core.setFailed(`Publishing blocked: CI for ${sha} did not pass within 15 minutes. ${runURL}`);

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image and verify registry digests
        env:
          POOL_IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_REF: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "$POOL_IMAGE:$RELEASE_VERSION"
          docker push "$POOL_IMAGE:latest"
          {
            printf 'Built and tested commit `%s` for **linux/amd64**.\n\n' "$RELEASE_REF"
            printf '| Image | Registry digest |\n| --- | --- |\n'
          } >> "$GITHUB_STEP_SUMMARY"
          version_digest=$(docker buildx imagetools inspect "$POOL_IMAGE:$RELEASE_VERSION" --format '{{.Manifest.Digest}}')
          latest_digest=$(docker buildx imagetools inspect "$POOL_IMAGE:latest" --format '{{.Manifest.Digest}}')
          [[ "$version_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$version_digest" = "$latest_digest"
          local_digest=$(docker image inspect "$POOL_IMAGE:$RELEASE_VERSION" --format '{{index .RepoDigests 0}}')
          test "${local_digest##*@}" = "$version_digest"
          printf '| `%s:%s` | `%s` |\n' "$POOL_IMAGE" "$RELEASE_VERSION" "$version_digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Extract the tested application and update manifest
        env:
          POOL_IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_REF: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pool-app-release"
          extract=$(docker create --network none "$POOL_IMAGE:$RELEASE_VERSION")
          trap 'docker rm "$extract" >/dev/null 2>&1 || true' EXIT
          docker cp "$extract:/app/sub2api" "$RUNNER_TEMP/pool-app-release/sub2api-linux-amd64"
          asset="$RUNNER_TEMP/pool-app-release/sub2api-linux-amd64"
          sha=$(sha256sum "$asset" | cut -d ' ' -f 1)
          size=$(stat -c %s "$asset")
          test "$size" -gt 0
          jq -n --arg version "$RELEASE_VERSION" --arg revision "$RELEASE_REF" \
            --arg sha256 "$sha" --argjson size "$size" \
            '{schema_version: 1, version: $version, revision: $revision, platform: "linux/amd64",
              asset: "sub2api-linux-amd64", sha256: $sha256, size: $size}' \
            > "$RUNNER_TEMP/pool-app-release/pool-update.json"

      - name: Publish complete application update release
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_REF: ${{ steps.release.outputs.commit }}
          POOL_IMAGE: ${{ steps.release.outputs.image }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const version = process.env.RELEASE_VERSION;
            const revision = process.env.RELEASE_REF;
            const tag = `pool-v${version.replace('-pool.', '.')}`;
            const directory = path.join(process.env.RUNNER_TEMP, 'pool-app-release');
            const manifestBytes = fs.readFileSync(path.join(directory, 'pool-update.json'));
            const manifest = JSON.parse(manifestBytes);
            const binary = fs.readFileSync(path.join(directory, 'sub2api-linux-amd64'));
            const digest = crypto.createHash('sha256').update(binary).digest('hex');
            if (manifest.version !== version || manifest.revision !== revision ||
                manifest.sha256 !== digest || manifest.size !== binary.length) {
              throw new Error('Extracted application does not match the update manifest.');
            }
            const body = [
              `Pool ${version} built from \`${revision}\`.`,
              '',
              `Image: \`${process.env.POOL_IMAGE}:${version}\` (also published as \`latest\`).`,
              '',
              'The online updater installs this release\'s verified Linux amd64 application, including its embedded frontend. The Docker image tag and system dependencies remain unchanged.',
              'The first upgrade from an older image requires one Docker image update to install the persistent runtime entrypoint. Automatic recovery restores the previous application; it does not roll back database migrations.',
              '',
              `Application SHA-256: \`${digest}\``,
              `Build and validation: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (release && (!release.draft || release.target_commitish !== revision)) {
              throw new Error(`Refusing to overwrite published or mismatched release ${tag}.`);
            }
            if (!release) {
              ({ data: release } = await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, target_commitish: revision,
                name: `Sub2API Pool ${version}`, body, draft: true, prerelease: true,
                make_latest: 'false',
              }));
            }
            // Failed attempts remain drafts and cannot be discovered by the updater.
            // Only assets in this unpublished draft may be replaced on retry.
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: release.id, per_page: 100,
            });
            for (const asset of assets) {
              if (['sub2api-linux-amd64', 'pool-update.json'].includes(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: asset.id });
              }
            }
            for (const [name, data, type] of [
              ['sub2api-linux-amd64', binary, 'application/octet-stream'],
              ['pool-update.json', manifestBytes, 'application/json'],
            ]) {
              const { data: asset } = await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.id, name, data,
                headers: { 'content-type': type, 'content-length': data.length },
              });
              if (asset.state !== 'uploaded' || asset.size !== data.length ||
                  (asset.digest && asset.digest !== `sha256:${crypto.createHash('sha256').update(data).digest('hex')}`)) {
                throw new Error(`Uploaded asset ${name} failed verification; release remains a draft.`);
              }
            }
            const { data: published } = await github.rest.repos.updateRelease({
              ...context.repo, release_id: release.id, body, draft: false,
              prerelease: true, make_latest: 'false',
            });
            core.summary.addLink(`Online update ${version}`, published.html_url);
            await core.summary.write();

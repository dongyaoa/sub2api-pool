name: Pool Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Pool image version, e.g. 0.2.7-pool.1 (without v)'
        required: true
        type: string
      ref:
        description: 'Full 40-character commit SHA to build'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: pool-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate release inputs
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ inputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-pool\.[0-9]+$ ]] || {
            echo '::error::version must match MAJOR.MINOR.PATCH-pool.NUMBER'
            exit 1
          }
          [[ "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::ref must be a full lowercase commit SHA'
            exit 1
          }
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "version=$RELEASE_VERSION"
            echo "commit=$RELEASE_REF"
            echo "image=$image"
            echo "worker_image=${image}-openai-reauth-worker"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.commit }}
          persist-credentials: false

      - name: Verify checkout
        env:
          RELEASE_REF: ${{ steps.release.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_REF"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Load each image once and test both before updating any registry tag.
      - name: Build pool image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          pull: true
          provenance: false
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:latest
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            COMMIT=${{ steps.release.outputs.commit }}
            DATE=${{ steps.release.outputs.created }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.commit }}
            org.opencontainers.image.created=${{ steps.release.outputs.created }}
          cache-from: type=gha,scope=pool-main-amd64
          cache-to: type=gha,mode=max,scope=pool-main-amd64

      - name: Build login worker image
        uses: docker/build-push-action@v6
        with:
          context: tools/openai-reauth-worker
          file: tools/openai-reauth-worker/Dockerfile
          platforms: linux/amd64
          load: true
          pull: true
          provenance: false
          tags: |
            ${{ steps.release.outputs.worker_image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.worker_image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.commit }}
            org.opencontainers.image.created=${{ steps.release.outputs.created }}
          cache-from: type=gha,scope=pool-reauth-worker-amd64
          cache-to: type=gha,mode=max,scope=pool-reauth-worker-amd64

      - name: Verify image metadata and pool runtime
        env:
          POOL_IMAGE: ${{ steps.release.outputs.image }}
          WORKER_IMAGE: ${{ steps.release.outputs.worker_image }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_REF: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          for image in "$POOL_IMAGE" "$WORKER_IMAGE"; do
            metadata=$(docker image inspect "$image:$RELEASE_VERSION")
            jq -e --arg sha "$RELEASE_REF" --arg version "$RELEASE_VERSION" \
              '.[0] | .Os == "linux" and .Architecture == "amd64" and
              .Config.Labels["org.opencontainers.image.revision"] == $sha and
              .Config.Labels["org.opencontainers.image.version"] == $version' <<< "$metadata"
          done
          version_output=$(docker run --rm --network none "$POOL_IMAGE:$RELEASE_VERSION" --version 2>&1)
          printf '%s\n' "$version_output"
          grep -F "Sub2API $RELEASE_VERSION (commit: $RELEASE_REF," <<< "$version_output"
          docker run -d --name pool-runtime-smoke --network none \
            -e SERVER_HOST=127.0.0.1 -e SERVER_PORT=8080 "$POOL_IMAGE:$RELEASE_VERSION"
          trap 'docker rm -f pool-runtime-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if docker exec pool-runtime-smoke wget -q -O - http://127.0.0.1:8080/setup/status \
              | jq -e '.data.needs_setup == true' >/dev/null; then
              docker exec pool-runtime-smoke wget -q -O - http://127.0.0.1:8080/ \
                | grep -i '<!doctype html' >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs pool-runtime-smoke
          echo '::error::Pool setup server did not become ready'
          exit 1

      - name: Test worker image and health endpoint
        env:
          WORKER_IMAGE: ${{ steps.release.outputs.worker_image }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Synthetic browser fixtures and the local test proxy need no external network.
          docker run --rm --network none --shm-size=1g \
            --mount "type=bind,source=$PWD/tools/openai-reauth-worker/test,target=/app/test,readonly" \
            "$WORKER_IMAGE:$RELEASE_VERSION" npm test
          worker_token=$(openssl rand -hex 32)
          echo "::add-mask::$worker_token"
          docker run -d --name pool-worker-smoke --network none \
            -e OPENAI_REAUTH_WORKER_TOKEN="$worker_token" "$WORKER_IMAGE:$RELEASE_VERSION"
          trap 'docker rm -f pool-worker-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if docker exec pool-worker-smoke node --input-type=module -e \
              'const response = await fetch("http://127.0.0.1:8091/health"); process.exit(response.ok && (await response.json()).status === "ok" ? 0 : 1)'; then
              exit 0
            fi
            sleep 1
          done
          docker logs pool-worker-smoke
          echo '::error::Login worker did not become healthy'
          exit 1

      - name: Require successful CI for the release commit
        uses: actions/github-script@v8
        timeout-minutes: 16
        env:
          RELEASE_REF: ${{ steps.release.outputs.commit }}
        with:
          script: |
            const sha = process.env.RELEASE_REF;
            const deadline = Date.now() + 15 * 60 * 1000;
            let previousState = '';
            let runURL = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/backend-ci.yml`;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: 'backend-ci.yml',
                head_sha: sha,
                event: 'push',
                per_page: 10,
              });
              const run = data.workflow_runs
                .filter(item => item.head_sha === sha && item.event === 'push')
                .sort((a, b) => b.id - a.id)[0];
              if (run) {
                runURL = run.html_url;
                const state = `${run.id}:${run.run_attempt}:${run.status}:${run.conclusion}`;
                if (state !== previousState) {
                  core.info(`CI for ${sha}: ${run.status} (${run.conclusion || 'pending'}) — ${runURL}`);
                  previousState = state;
                }
                if (run.status === 'completed') {
                  if (run.conclusion !== 'success') {
                    core.setFailed(`Publishing blocked: CI concluded ${run.conclusion} for ${sha}. ${runURL}`);
                    return;
                  }
                  core.info(`Release CI passed: ${runURL}`);
                  return;
                }
              } else if (previousState !== 'missing') {
                core.info(`Waiting for the backend-ci.yml push run for ${sha}. ${runURL}`);
                previousState = 'missing';
              }
              await new Promise(resolve => setTimeout(resolve, Math.min(30_000, Math.max(0, deadline - Date.now()))));
            }
            core.setFailed(`Publishing blocked: CI for ${sha} did not pass within 15 minutes. ${runURL}`);

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested images and verify registry digests
        env:
          POOL_IMAGE: ${{ steps.release.outputs.image }}
          WORKER_IMAGE: ${{ steps.release.outputs.worker_image }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_REF: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          for image in "$POOL_IMAGE" "$WORKER_IMAGE"; do
            docker push "$image:$RELEASE_VERSION"
          done
          for image in "$POOL_IMAGE" "$WORKER_IMAGE"; do
            docker push "$image:latest"
          done
          {
            printf 'Built and tested commit `%s` for **linux/amd64**.\n\n' "$RELEASE_REF"
            printf '| Image | Registry digest |\n| --- | --- |\n'
          } >> "$GITHUB_STEP_SUMMARY"
          for image in "$POOL_IMAGE" "$WORKER_IMAGE"; do
            version_digest=$(docker buildx imagetools inspect "$image:$RELEASE_VERSION" --format '{{.Manifest.Digest}}')
            latest_digest=$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}')
            [[ "$version_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            test "$version_digest" = "$latest_digest"
            local_digest=$(docker image inspect "$image:$RELEASE_VERSION" --format '{{index .RepoDigests 0}}')
            test "${local_digest##*@}" = "$version_digest"
            printf '| `%s:%s` | `%s` |\n' "$image" "$RELEASE_VERSION" "$version_digest" >> "$GITHUB_STEP_SUMMARY"
          done

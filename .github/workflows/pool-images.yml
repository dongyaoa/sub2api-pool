name: Pool Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Pool image version, e.g. 0.2.7-pool.2 (without v)'
        required: true
        type: string
      ref:
        description: 'Full 40-character commit SHA to build'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: pool-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate release inputs
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ inputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-pool\.[0-9]+$ ]] || {
            echo '::error::version must match MAJOR.MINOR.PATCH-pool.NUMBER'
            exit 1
          }
          [[ "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::ref must be a full lowercase commit SHA'
            exit 1
          }
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "version=$RELEASE_VERSION"
            echo "commit=$RELEASE_REF"
            echo "image=$image"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.commit }}
          persist-credentials: false

      - name: Verify checkout
        env:
          RELEASE_REF: ${{ steps.release.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_REF"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Load and test the image before updating any registry tag.
      - name: Build pool image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          pull: true
          provenance: false
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:latest
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            COMMIT=${{ steps.release.outputs.commit }}
            DATE=${{ steps.release.outputs.created }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.commit }}
            org.opencontainers.image.created=${{ steps.release.outputs.created }}
          cache-from: type=gha,scope=pool-main-amd64
          cache-to: type=gha,mode=max,scope=pool-main-amd64

      - name: Verify host updater packaging and real Docker recovery
        env:
          POOL_IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash -n deploy/install-pool-updater.sh
          PYTHONDONTWRITEBYTECODE=1 python3 deploy/tests/pool-updater-config-test.py
          extract=$(docker create --network none "$POOL_IMAGE:$RELEASE_VERSION")
          trap 'docker rm "$extract" >/dev/null 2>&1 || true' EXIT
          docker cp "$extract:/app/pool-updater" "$RUNNER_TEMP/pool-updater"
          docker cp "$extract:/app/pool-updater-install" "$RUNNER_TEMP/pool-updater-install"
          test -s "$RUNNER_TEMP/pool-updater-install/install-pool-updater.sh"
          test -s "$RUNNER_TEMP/pool-updater-install/pool-updater-config.py"
          test -s "$RUNNER_TEMP/pool-updater-install/pool-updater-compose.py"
          test -s "$RUNNER_TEMP/pool-updater-install/pool-updater.service"
          sudo /bin/bash deploy/tests/pool-updater-smoke.sh "$RUNNER_TEMP/pool-updater" "$POOL_IMAGE:$RELEASE_VERSION"

      - name: Verify image metadata and pool runtime
        env:
          POOL_IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_REF: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          metadata=$(docker image inspect "$POOL_IMAGE:$RELEASE_VERSION")
          jq -e --arg sha "$RELEASE_REF" --arg version "$RELEASE_VERSION" \
            '.[0] | .Os == "linux" and .Architecture == "amd64" and
            .Config.Labels["org.opencontainers.image.revision"] == $sha and
            .Config.Labels["org.opencontainers.image.version"] == $version' <<< "$metadata"
          version_output=$(docker run --rm --network none "$POOL_IMAGE:$RELEASE_VERSION" --version 2>&1)
          printf '%s\n' "$version_output"
          grep -F "Sub2API $RELEASE_VERSION (commit: $RELEASE_REF," <<< "$version_output"
          docker run -d --name pool-runtime-smoke --network none \
            -e SERVER_HOST=127.0.0.1 -e SERVER_PORT=8080 "$POOL_IMAGE:$RELEASE_VERSION"
          trap 'docker rm -f pool-runtime-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if docker exec pool-runtime-smoke wget -q -O - http://127.0.0.1:8080/setup/status \
              | jq -e '.data.needs_setup == true' >/dev/null; then
              docker exec pool-runtime-smoke wget -q -O - http://127.0.0.1:8080/ \
                | grep -i '<!doctype html' >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs pool-runtime-smoke
          echo '::error::Pool setup server did not become ready'
          exit 1

      - name: Require successful CI for the release commit
        uses: actions/github-script@v8
        timeout-minutes: 16
        env:
          RELEASE_REF: ${{ steps.release.outputs.commit }}
        with:
          script: |
            const sha = process.env.RELEASE_REF;
            const deadline = Date.now() + 15 * 60 * 1000;
            let previousState = '';
            let runURL = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/backend-ci.yml`;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: 'backend-ci.yml',
                head_sha: sha,
                event: 'push',
                per_page: 10,
              });
              const run = data.workflow_runs
                .filter(item => item.head_sha === sha && item.event === 'push')
                .sort((a, b) => b.id - a.id)[0];
              if (run) {
                runURL = run.html_url;
                const state = `${run.id}:${run.run_attempt}:${run.status}:${run.conclusion}`;
                if (state !== previousState) {
                  core.info(`CI for ${sha}: ${run.status} (${run.conclusion || 'pending'}) — ${runURL}`);
                  previousState = state;
                }
                if (run.status === 'completed') {
                  if (run.conclusion !== 'success') {
                    core.setFailed(`Publishing blocked: CI concluded ${run.conclusion} for ${sha}. ${runURL}`);
                    return;
                  }
                  core.info(`Release CI passed: ${runURL}`);
                  return;
                }
              } else if (previousState !== 'missing') {
                core.info(`Waiting for the backend-ci.yml push run for ${sha}. ${runURL}`);
                previousState = 'missing';
              }
              await new Promise(resolve => setTimeout(resolve, Math.min(30_000, Math.max(0, deadline - Date.now()))));
            }
            core.setFailed(`Publishing blocked: CI for ${sha} did not pass within 15 minutes. ${runURL}`);

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image and verify registry digests
        env:
          POOL_IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_REF: ${{ steps.release.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "$POOL_IMAGE:$RELEASE_VERSION"
          docker push "$POOL_IMAGE:latest"
          {
            printf 'Built and tested commit `%s` for **linux/amd64**.\n\n' "$RELEASE_REF"
            printf '| Image | Registry digest |\n| --- | --- |\n'
          } >> "$GITHUB_STEP_SUMMARY"
          version_digest=$(docker buildx imagetools inspect "$POOL_IMAGE:$RELEASE_VERSION" --format '{{.Manifest.Digest}}')
          latest_digest=$(docker buildx imagetools inspect "$POOL_IMAGE:latest" --format '{{.Manifest.Digest}}')
          [[ "$version_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$version_digest" = "$latest_digest"
          local_digest=$(docker image inspect "$POOL_IMAGE:$RELEASE_VERSION" --format '{{index .RepoDigests 0}}')
          test "${local_digest##*@}" = "$version_digest"
          printf '| `%s:%s` | `%s` |\n' "$POOL_IMAGE" "$RELEASE_VERSION" "$version_digest" >> "$GITHUB_STEP_SUMMARY"

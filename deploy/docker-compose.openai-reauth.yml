# Overlay for an existing deployment; keep using its original Compose file,
# project name, .env, volumes and database. See OPENAI_AUTO_REAUTH_CN.md.
services:
  sub2api:
    image: ghcr.io/dongyaoa/sub2api-pool:${SUB2API_POOL_VERSION:?Set SUB2API_POOL_VERSION to the released image tag}
    environment:
      OPENAI_REAUTH_WORKER_URL: http://127.0.0.1:8091
      OPENAI_REAUTH_WORKER_TOKEN: ${OPENAI_REAUTH_WORKER_TOKEN:?Set a shared random token of at least 32 characters}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Keep the existing fixed 64-character hex encryption key}

  openai-reauth-worker:
    image: ghcr.io/dongyaoa/sub2api-pool-openai-reauth-worker:${SUB2API_POOL_VERSION:?Set SUB2API_POOL_VERSION to the released image tag}
    restart: unless-stopped
    init: true
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    # Shares only the app's network namespace. No host port or data mount is
    # needed; login credentials travel over loopback instead of plaintext LAN.
    network_mode: service:sub2api
    environment:
      HOST: 127.0.0.1
      PORT: "8091"
      OPENAI_REAUTH_WORKER_TOKEN: ${OPENAI_REAUTH_WORKER_TOKEN:?Set a shared random token of at least 32 characters}
      OPENAI_REAUTH_WORKER_CONCURRENCY: ${OPENAI_REAUTH_WORKER_CONCURRENCY:-1}
      TZ: ${TZ:-Asia/Shanghai}
